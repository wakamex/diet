- product_id: "0003160401617"
  name: "Nature Made® Flaxseed Oil Softgels 1000mg"
  count: 100
  # Current manufacturer label: 1000 mg flaxseed oil containing 500 mg ALA.
  # The softgel shell brings total tablet mass to approximately 1.2 g.
  tablet_g: 1.2
