# USDA records that describe only part of what is sold, mapped to that part's
# share of the purchased weight. Products are priced by purchased weight, so
# values from these records are scaled by this share. Values from product
# labels and from records that describe the whole purchase are unchanged.
#
# Bone, peel and core shares are the Canadian Nutrient File's total refuse
# for the same food. Drained cans: a US 15.5 oz (439 g) can of beans drains to
# about 253 to 260 g, and 170 g tuna cans to about 120 g; salmon, sardines,
# mackerel, clams and canned potatoes are estimates. The great northern and
# white bean records are denser than whole can contents (114 kcal/100 g,
# against about 85 implied by dried beans at 4 g of can per gram), so they
# count as 74% of can weight.

