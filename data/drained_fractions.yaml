# USDA records that describe drained canned food, mapped to the share of the
# can's net weight that is left after draining. Products are priced by net
# weight, so values from these records are scaled by this share. Values from
# product labels and from whole-can records are left as they are.
#
# Beans: a US 15.5 oz (439 g) can drains to about 253 to 260 g. Tuna: 170 g
# cans drain to about 120 g. Salmon, sardines, mackerel, clams and canned
# carrots are estimates. Great northern beans' record is denser than whole can
# contents (114 kcal/100 g, against about 85 implied by dried beans at 4 g of
# can per gram), so it counts as 74% of can weight.

2644288: 0.6    # chickpeas, canned, drained and rinsed
174285: 0.6     # kidney beans, canned, drained solids
175243: 0.6     # kidney beans, canned, drained solids, rinsed
175192: 0.74    # great northern beans, canned
173708: 0.7     # tuna, light, canned in oil, drained solids
175175: 0.85    # salmon, pink, canned, drained solids
175139: 0.85    # sardines, canned in oil, drained solids with bone
175121: 0.85    # mackerel, canned, drained solids
171976: 0.5     # clams, canned, drained solids
170396: 0.6     # carrots, canned, drained solids
