# Walmart.com national pricing via Affiliate API (no per-store granularity until
# OPD partner approval lands). Location ID is synthetic — Affiliate API doesn't
# take one; the region key is what the ingest code routes on.
- region: walmart_national
  location_id: "walmart-national"
  display: "Walmart.com (national)"
  source: walmart
  price_scope: national

- region: hawaii
  location_id: "3478"
  display: "Walmart — 700 Keeaumoku St, Honolulu, HI 96814"
  source: walmart

# Derived optimizer venue: every currently priced Canadian SKU is eligible,
# while basket rows retain the member retailer that supplies their price.
- region: canada_reference
  location_id: "canada-reference"
  display: "All Canada Reference (best across five chains)"
  source: canada
  currency: CAD
  price_scope: reference
  member_regions:
    - metro_reference
    - foodbasics_reference
    - superstore_reference
    - nofrills_reference
    - walmart_ca_reference

- region: metro_reference
  location_id: "metro-reference"
  display: "Metro Reference (Canada; unlocalized online catalog)"
  source: metro
  currency: CAD
  price_scope: reference

- region: foodbasics_reference
  location_id: "foodbasics-reference"
  display: "Food Basics Reference (Canada; unlocalized online catalog)"
  source: foodbasics
  currency: CAD
  price_scope: reference

# PC Express storefront defaults are explicit store-scoped references. These
# IDs are the banners' configured defaultStoreId/masterStoreId, not a national
# average or the cheapest store in the chain.
- region: superstore_reference
  location_id: "1033"
  display: "Superstore Reference — Dufferin & Steeles, Toronto"
  source: superstore
  currency: CAD
  price_scope: reference
  reference_store_name: "Real Canadian Superstore — Dufferin & Steeles"
  reference_store_address: "51 Gerry Fitzgerald Dr, Toronto, ON M3J 3N4"
  reference_store_basis: "PC Express storefront defaultStoreId/masterStoreId"

- region: nofrills_reference
  location_id: "3787"
  display: "No Frills Reference — Chris & Tanya's, Renfrew"
  source: nofrills
  currency: CAD
  price_scope: reference
  reference_store_name: "Chris & Tanya's No Frills"
  reference_store_address: "680 O'Brien Rd, Renfrew, ON K7V 3S1"
  reference_store_basis: "PC Express storefront defaultStoreId/masterStoreId"

- region: walmart_ca_reference
  location_id: "walmart-ca-reference"
  display: "Walmart.ca Reference (unlocalized online catalog)"
  source: walmart_ca
  currency: CAD
  price_scope: reference
